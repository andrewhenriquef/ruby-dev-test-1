---
openapi: 3.0.1
info:
  title: API V1
  version: v1
paths:
  "/api/v1/directories":
    get:
      summary: list directories
      tags:
      - Directories
      responses:
        '200':
          description: successful
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                    name:
                      type: string
                    parent_id:
                      type:
                      - integer
                      - 'null'
                    created_at:
                      type: datetime
                    updated_at:
                      type: datetime
                  required:
                  - id
                  - name
                  - parent_id
                  - created_at
                  - updated_at
    post:
      summary: Creates a directory
      tags:
      - Directories
      parameters: []
      responses:
        '201':
          description: directory created
        '422':
          description: unprocessable_entity
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                directory:
                  type: object
                  properties:
                    name:
                      type: string
                    parent_id:
                      type:
                      - integer
                      - 'null'
                  required:
                  - name
              required:
              - directory
  "/api/v1/directories/{id}":
    parameters:
    - name: id
      in: path
      description: id
      required: true
      schema:
        type: string
    get:
      summary: show directory
      tags:
      - Directories
      responses:
        '200':
          description: successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  name:
                    type: string
                  parent_id:
                    type:
                    - integer
                    - 'null'
                  created_at:
                    type: datetime
                  updated_at:
                    type: datetime
                required:
                - id
                - name
                - parent_id
                - created_at
                - updated_at
        '404':
          description: not found
    put:
      summary: Updates a directory
      tags:
      - Directories
      parameters:
      - name: id
        in: path
        description: id
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: directory updated
        '404':
          description: not found
        '422':
          description: unprocessable_entity
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                directory:
                  type: object
                  properties:
                    name:
                      type: string
                  required:
                  - name
    delete:
      summary: Deletes a directory
      tags:
      - Directories
      parameters:
      - name: id
        in: path
        description: id
        required: true
        schema:
          type: integer
      responses:
        '204':
          description: directory deleted
        '404':
          description: not found
  "/api/v1/directories/{id}/subdirectories":
    parameters:
    - name: id
      in: path
      description: id
      required: true
      schema:
        type:
        - integer
        - string
    get:
      summary: subdirectories directory
      tags:
      - Directories
      responses:
        '200':
          description: successful
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                    name:
                      type: string
                    parent_id:
                      type:
                      - integer
                      - 'null'
                    created_at:
                      type: datetime
                    updated_at:
                      type: datetime
                  required:
                  - id
                  - name
                  - parent_id
                  - created_at
                  - updated_at
  "/api/v1/directories/{directory_id}/documents":
    parameters:
    - name: directory_id
      in: path
      description: directory id
      required: true
      schema:
        type: integer
    get:
      summary: list documents
      tags:
      - Documents
      responses:
        '200':
          description: successful
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                    name:
                      type: string
                    directory_id:
                      type: integer
                    created_at:
                      type: string
                      format: date-time
                    updated_at:
                      type: string
                      format: date-time
                  required:
                  - id
                  - name
                  - directory_id
                  - created_at
                  - updated_at
    post:
      summary: Creates a document
      tags:
      - Documents
      parameters:
      - name: directory_id
        in: path
        description: directory id
        required: true
        schema:
          type: integer
      responses:
        '201':
          description: document created
        '422':
          description: unprocessable_entity
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: string
        required: true
        description: the filename
  "/api/v1/directories/{directory_id}/documents/{id}":
    parameters:
    - name: directory_id
      in: path
      description: directory id
      required: true
      schema:
        type: integer
    - name: id
      in: path
      description: document id
      required: true
      schema:
        type: integer
    get:
      summary: show document
      tags:
      - Documents
      responses:
        '200':
          description: successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  name:
                    type: string
                  directory_id:
                    type: integer
                  created_at:
                    type: string
                    format: date-time
                  updated_at:
                    type: string
                    format: date-time
                required:
                - id
                - name
                - directory_id
                - created_at
                - updated_at
        '404':
          description: not found
    put:
      summary: update document
      tags:
      - Documents
      parameters:
      - name: directory_id
        in: path
        required: true
        schema:
          type: integer
      - name: id
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: document updated
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: file
        required: true
    delete:
      summary: delete document
      tags:
      - Documents
      responses:
        '204':
          description: document deleted
        '404':
          description: not found
servers:
- url: http://{defaultHost}
  variables:
    defaultHost:
      default: localhost:3000
